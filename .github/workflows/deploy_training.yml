name: Deploy Unique Training Page

on:
  repository_dispatch:
    types: [license_purchased]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      - name: Mask Sensitive Data
        run: |
          PAYMENT_ID=$(jq -r '.client_payload.payment_id // empty' $GITHUB_EVENT_PATH)
          LICENSE_KEY=$(jq -r '.client_payload.license_key // empty' $GITHUB_EVENT_PATH)
          if [ -n "$PAYMENT_ID" ] && [ "$PAYMENT_ID" != "null" ]; then
            echo "::add-mask::$PAYMENT_ID"
          fi
          if [ -n "$LICENSE_KEY" ] && [ "$LICENSE_KEY" != "null" ]; then
            echo "::add-mask::$LICENSE_KEY"
          fi

      - name: Checkout Private Source Repo
        uses: actions/checkout@v4
        with:
          repository: hardik05/fuzzing-source
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine Course from Payment Amount
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
        run: |
          PAYMENT_ID=$(jq -r '.client_payload.payment_id // empty' $GITHUB_EVENT_PATH)
          PAYLOAD_AMOUNT=$(jq -r '.client_payload.amount // empty' $GITHUB_EVENT_PATH)
          PAYLOAD_COURSE_ID=$(jq -r '.client_payload.course_id // .client_payload.course // empty' $GITHUB_EVENT_PATH)
          
          AMOUNT=""
          
          # 1. If payment ID looks like a Razorpay payment or order ID, attempt API verification
          if [[ $PAYMENT_ID == pay_* ]]; then
            echo "Verifying payment details with Razorpay API for $PAYMENT_ID..."
            if [ -n "$RAZORPAY_KEY_ID" ] && [ -n "$RAZORPAY_KEY_SECRET" ]; then
              RESPONSE=$(curl -s -u "${RAZORPAY_KEY_ID}:${RAZORPAY_KEY_SECRET}" \
                "https://api.razorpay.com/v1/payments/${PAYMENT_ID}")
              AMOUNT=$(echo "$RESPONSE" | jq -r '.amount // empty')
              if [ -z "$AMOUNT" ] || [ "$AMOUNT" == "null" ]; then
                ERR_MSG=$(echo "$RESPONSE" | jq -r '.error.description // empty')
                if [ -n "$ERR_MSG" ] && [ "$ERR_MSG" != "null" ]; then
                  echo "Warning: Razorpay API returned error: $ERR_MSG"
                fi
                AMOUNT=""
              fi
            else
              echo "Warning: Razorpay API credentials (RAZORPAY_KEY_ID/RAZORPAY_KEY_SECRET) not set."
            fi
          elif [[ $PAYMENT_ID == order_* ]]; then
            echo "Verifying order details with Razorpay API for $PAYMENT_ID..."
            if [ -n "$RAZORPAY_KEY_ID" ] && [ -n "$RAZORPAY_KEY_SECRET" ]; then
              RESPONSE=$(curl -s -u "${RAZORPAY_KEY_ID}:${RAZORPAY_KEY_SECRET}" \
                "https://api.razorpay.com/v1/orders/${PAYMENT_ID}")
              AMOUNT=$(echo "$RESPONSE" | jq -r '.amount // empty')
              if [ -z "$AMOUNT" ] || [ "$AMOUNT" == "null" ]; then
                ERR_MSG=$(echo "$RESPONSE" | jq -r '.error.description // empty')
                if [ -n "$ERR_MSG" ] && [ "$ERR_MSG" != "null" ]; then
                  echo "Warning: Razorpay API returned error: $ERR_MSG"
                fi
                AMOUNT=""
              fi
            else
              echo "Warning: Razorpay API credentials not set."
            fi
          fi
          
          # 2. Fallback to payload amount if Razorpay API didn't yield an amount
          if [ -z "$AMOUNT" ] && [ -n "$PAYLOAD_AMOUNT" ] && [ "$PAYLOAD_AMOUNT" != "null" ]; then
            echo "Using payload amount as fallback: $PAYLOAD_AMOUNT"
            AMOUNT="$PAYLOAD_AMOUNT"
          fi
          
          echo "Payment/Order ID: $PAYMENT_ID"
          echo "Verified/Detected Amount: $AMOUNT"
          
          # Determine Course ID based on Amount or explicit Payload Course ID
          # 799900 paise = ₹7,999 -> Mastering Linux Fuzzing
          # 1499900 paise = ₹14,999 -> Practical Fuzzing
          # 3999900 paise = ₹39,999 -> Practical Fuzzing (Commercial)
          
          COURSE_ID=""
          if [ "$AMOUNT" == "799900" ] || [ "$AMOUNT" == "7999" ]; then
            echo "Detected Course: Mastering Linux Fuzzing (Amount: $AMOUNT)"
            COURSE_ID="mastering_linux"
          elif [ "$AMOUNT" == "1499900" ] || [ "$AMOUNT" == "14999" ] || [ "$AMOUNT" == "3999900" ] || [ "$AMOUNT" == "39999" ]; then
            echo "Detected Course: Practical Fuzzing (Amount: $AMOUNT)"
            COURSE_ID="practical_fuzzing"
          elif [ -n "$PAYLOAD_COURSE_ID" ] && [ "$PAYLOAD_COURSE_ID" != "null" ]; then
            echo "Using course_id from payload: $PAYLOAD_COURSE_ID"
            case "$PAYLOAD_COURSE_ID" in
              mastering*|linux*)
                COURSE_ID="mastering_linux"
                ;;
              practical*|fuzzing*)
                COURSE_ID="practical_fuzzing"
                ;;
              *)
                COURSE_ID="$PAYLOAD_COURSE_ID"
                ;;
            esac
          fi
          
          if [ -n "$COURSE_ID" ]; then
            echo "Setting COURSE_ID=$COURSE_ID"
            echo "COURSE_ID=$COURSE_ID" >> $GITHUB_ENV
          else
            echo "Error: Could not determine course. Amount '$AMOUNT' did not match known courses, and payload course_id '$PAYLOAD_COURSE_ID' is empty or invalid."
            exit 1
          fi

      - name: Encrypt Training Page
        env:
          SALT: ${{ secrets.TRAINING_FILENAME_SALT }}
        run: |
          # The payment ID comes from the webhook payload
          PAYMENT_ID=$(jq -r '.client_payload.payment_id' $GITHUB_EVENT_PATH)
          # COURSE_ID is now set in the previous step
          
          echo "Processing course: $COURSE_ID"

          if [ "$COURSE_ID" == "mastering_linux" ]; then
            OUTPUT_DIR="codelabs/Mastering_fuzzing_TyphoonCon23/access"
            # TODO: Verify the correct path in private-source repo for this course
            SOURCE_FILE="private-source/mastering/index.html" 
            if [ ! -f "$SOURCE_FILE" ]; then
                echo "Warning: Source file $SOURCE_FILE not found. Checking root index..."
                if [ -f "private-source/index.html" ]; then
                    echo "Using private-source/index.html as fallback."
                    SOURCE_FILE="private-source/index.html"
                else
                    echo "Error: No source file found."
                    exit 1
                fi
            fi
          elif [ "$COURSE_ID" == "practical_fuzzing" ]; then
            OUTPUT_DIR="codelabs/Practical_Fuzzing/access"
            SOURCE_FILE="private-source/index.html"
          else
            echo "Error: Invalid COURSE_ID: $COURSE_ID"
            exit 1
          fi
          
          # Ensure output directory exists
          mkdir -p "$OUTPUT_DIR"
          
          # Fix relative paths by replacing them in the source before encryption
          # Note: Both courses are at codelabs/COURSE_NAME/access, so depth is same (../../../)
          sed -e 's|href="../../|href="../../../|g' \
              -e 's|src="../../|src="../../../|g' \
              -e "s|href='../../|href='../../../|g" \
              -e "s|src='../../|src='../../../|g" \
              -e 's|src="img/|src="../img/|g' \
              -e 's|href="img/|href="../img/|g' \
              -e "s|src='img/|src='../img/|g" \
              -e "s|href='img/|href='../img/|g" \
              "$SOURCE_FILE" > private-source/index_fixed.html
          
          # Run Staticrypt (v3 uses -d for directory and doesn't have -o for filename)
          npx staticrypt private-source/index_fixed.html -p "$PAYMENT_ID" -d "$OUTPUT_DIR" --short -c false
          
          # Generate a deterministic but non-obvious filename from the payment ID
          # We use SHA256 with a salt to ensure the filename doesn't reveal the password
          # and is resistant to precomputed rainbow tables.
          if [ -z "$SALT" ]; then
            echo "Error: TRAINING_FILENAME_SALT secret is not set."
            exit 1
          fi
          FILENAME=$(echo -n "${PAYMENT_ID}${SALT}" | sha256sum | awk '{print $1}')
          
          # Rename the output file to the hashed filename
          mv "$OUTPUT_DIR/index_fixed.html" "$OUTPUT_DIR/$FILENAME.html"

      - name: Commit and Push
        run: |
          git config --global user.name "Fuzzing-in Bot"
          git config --global user.email "bot@fuzzing.in"
          git add codelabs/
          git commit -m "Add encrypted training access page"
          git push
